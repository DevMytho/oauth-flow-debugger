[package]
name = "oauth-flow-debugger"
version = "0.1.0"
description = "Visual OAuth 2.0 / OIDC flow debugger"
authors = ["devmytho"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.dev]
incremental = true
